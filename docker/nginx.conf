server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Bloqueia arquivos ocultos (.git etc.) — relevante no modo dev, que monta a pasta inteira
    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # HTML e JS/CSS sem cache longo: alterações aparecem ao recarregar
    # (add_header num location substitui os do server, por isso o nosniff se repete)
    location ~* \.(html|css|js)$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~* \.(png|jpg|jpeg|webp|svg|ico)$ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
