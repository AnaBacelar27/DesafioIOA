services:
  # Versão "produção": imagem com os arquivos copiados para dentro
  site:
    build: .
    image: ioa-itc-prototipo
    container_name: ioa-itc-prototipo
    ports:
      - "8080:80"
    restart: unless-stopped

  # Versão "desenvolvimento": usa os arquivos da sua pasta em tempo real
  # (edite e recarregue o navegador, sem rebuild)
  dev:
    image: nginx:1.27-alpine
    container_name: ioa-itc-prototipo-dev
    profiles: ["dev"]
    ports:
      - "8081:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
